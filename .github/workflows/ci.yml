name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager: 'pnpm'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager: 'pnpm'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit -- --detectOpenHandles

  integration-tests:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: verysecretsomething
      MYSQL_DATABASE: ms_auth_test
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: verysecretsomething
          MYSQL_DATABASE: ms_auth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager: 'pnpm'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be healthy..."
          for i in {1..30}; do
            if mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" >/dev/null 2>&1; then
              echo "MySQL is up"
              mysql_ready=true
              break
            fi
            echo "MySQL not ready yet, sleeping..."
            sleep 2
          done
          if [ "$mysql_ready" != "true" ]; then
            echo "MySQL did not become healthy in time"
            exit 1
          fi

      - name: Run integration tests
        run: pnpm run test:integration -- --detectOpenHandles

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: verysecretsomething
      MYSQL_DATABASE: ms_auth_test
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: verysecretsomething
          MYSQL_DATABASE: ms_auth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager: 'pnpm'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be healthy..."
          for i in {1..30}; do
            if mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" >/dev/null 2>&1; then
              echo "MySQL is up"
              mysql_ready=true
              break
            fi
            echo "MySQL not ready yet, sleeping..."
            sleep 2
          done
          if [ "$mysql_ready" != "true" ]; then
            echo "MySQL did not become healthy in time"
            exit 1
          fi

      - name: Run e2e tests
        run: pnpm run test:e2e -- --detectOpenHandles

  docker-release:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: verysecretsomething
      MYSQL_DATABASE: ms_auth_test
      JWT_SECRET: secret
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: verysecretsomething
          MYSQL_DATABASE: ms_auth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager: 'pnpm'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Approve pnpm build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Build release Docker image
        run: docker build --target release -t local/ms-auth:${{ github.sha }} .

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be healthy..."
          for i in {1..30}; do
            if mysqladmin ping -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" >/dev/null 2>&1; then
              echo "MySQL is up"
              break
            fi
            echo "MySQL not ready yet, sleeping..."
            sleep 2
          done

      - name: Run container-based integration smoke test
        run: |
          container_id=$(docker run --detach --rm --network host \
            -e MYSQL_HOST=127.0.0.1 \
            -e MYSQL_PORT=3306 \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=verysecretsomething \
            -e MYSQL_DATABASE=ms_auth_test \
            -e JWT_SECRET=secret \
            -e PORT=5501 \
            local/ms-auth:${{ github.sha }})
          trap "docker stop $container_id" EXIT
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:5501/ >/dev/null 2>&1; then
              echo "App is responding"
              app_ready=true
              break
            fi
            sleep 2
          done
          if [ "$app_ready" != "true" ]; then
            echo "Release container never became ready"
            exit 1
          fi
          # Smoke: signup creates a 201 and record is persisted
          status=$(curl -s -o /tmp/signup.json -w '%{http_code}' -X POST http://127.0.0.1:5501/signup \
            -H 'Content-Type: application/json' \
            -d '{"firstName":"ci","lastName":"smoke","email":"ci-smoke@example.com","phoneNumber":"+12345678901","role":"PATIENT","password":"Abcd1234!"}')
          echo "Signup status: $status"
          cat /tmp/signup.json
          if [ "$status" != "201" ]; then exit 1; fi
          row=$(mysql -h127.0.0.1 -P3306 -uroot -pverysecretsomething -D ms_auth_test -se \
            "SELECT health_id FROM users WHERE email='ci-smoke@example.com';")
          if [ -z "$row" ]; then echo "No signup record found in DB"; exit 1; fi
          echo "Smoke test passed. User created with health_id=$row"
