services:
  ms-auth-api:
    container_name: ms-auth-api
    user: root
    build:
      context: .
      target: base # Targets the first stage of the Dockerfile for dev
    volumes:
      - ./:/app:cached
      # The "Volume Trick": prevents local node_modules from overwriting container ones
      - /app/node_modules
    ports:
      - 127.0.0.1:5501:5501
    env_file:
      - ./.env
    links:
      - ms-auth-db
    environment:
      - NODE_ENV=dev
      - PORT=5501
      # Use polling for file-watchers (helps on Windows hosts with Docker bind mounts)
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - WATCHPACK_POLLING=true
      # TypeScript's watch mode (used by nest start --watch) does NOT respect CHOKIDAR_USEPOLLING.
      # It uses its own watcher, controlled by TSC_WATCHFILE. Force polling for Windows Docker bind mounts.
      - TSC_WATCHFILE=DynamicPriorityPolling
      - NOTIFICATION_SERVICE_URL=http://ms-notification-api:5502
    networks:
      - default
      - healthcare-internal
    # Using your wait-for pattern to ensure DB is ready before Nest starts
    command: >
      sh -c "./shell/wait-for.sh ms-auth-db:3306 -- sh ./shell/start-dev.sh"

  ms-auth-db:
    container_name: ms-auth-db
    image: mysql:8.0 # Recommended over 5.7 for modern NestJS/TypeORM features
    ports:
      - 127.0.0.1:5306:3306
    expose:
      - 3306
    env_file:
      - ./.env
    volumes:
      - ms-auth-db_vol:/var/lib/mysql
    restart: always

volumes:
  ms-auth-db_vol:

networks:
  default: {}
  healthcare-internal:
    external: true
    name: healthcare-internal
